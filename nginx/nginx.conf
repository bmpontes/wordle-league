# Reverse proxy opcional para o Wordle League.
# Ao usar este proxy, defina no .env:  TRUST_PROXY=1
# Com HTTPS ativo, defina também:       COOKIE_SECURE=true

server {
    listen 80;
    server_name _;

    # --- Para usar HTTPS, descomente o redirecionamento e o bloco "listen 443" abaixo. ---
    # return 301 https://$host$request_uri;

    client_max_body_size 8m;   # importação de listas de palavras (máx. 5 MB de texto)
    server_tokens off;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

