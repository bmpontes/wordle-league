name: forense-wordle-league

services:
  app:
    build: .
    image: forense-wordle-league:1.0.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
    ports:
      # Porta no anfitrião configurável com APP_PORT (por omissão 3000).
      - "${APP_PORT:-3000}:3000"
    volumes:
      - wordle-data:/app/data
    stop_grace_period: 15s

  # Reverse proxy opcional: docker compose --profile proxy up -d
  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  # Base de dados SQLite, segredo de sessão e backups. Sobrevive à recriação do contentor.
  wordle-data:
